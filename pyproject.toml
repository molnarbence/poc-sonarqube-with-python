[project]
name = "poc-sonarqube-with-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi[standard]>=0.134.0", "pydantic>=2.12.5"]

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-cov>=7.0.0", "ruff>=0.15.4", "ty>=0.0.19"]


[tool.ruff]
# Set the maximum line length
line-length = 120
exclude = [".git", "__pycache__", ".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
# Enable these rule categories
select = [
    "A",      # flake8-builtins
    "ARG",    # flake8-unusued-arguments
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
    "C4",     # flake8-comprehensions
    "C90",    # McCabe Complexity
    "DTZ",    # flake8-datetimez
    "E",      # pycodestyle
    "EM",     # flake8-errmsg
    "F",      # Pyflakes
    "G",      # flake8-logging-format
    "FLY",    # Flynt
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "N",      # PEP8 Naming
    "PERF",   # Perflint
    "PIE",    # flake8-pie
    "PL",     # Pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "RUF",    # Ruff-specific
    "RSE",    # flake8-raise
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "SLF001", # flake8-self private-member-access
    "SLOT",   # flake8-slots
    "TCH",    # flake8-typechecking
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops
    "T20",    # flake8-print
    "T100",   # flake8-debugger
    "UP",     # pyupgrade
    "W",      # pycodestyle
]

[tool.ruff.lint.per-file-ignores]
# Tests can have more flexible rules
"tests/**/*.py" = [
    "PLR2004", # Magic value used in comparison
    "S101",    # Use of assert
    "S105",
    "S106",
    "S107",
    "T201",    # Print statements in tests
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-quotes]
# Use double quotes
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.coverage.run]
branch = true
source = ["app"]
relative_files = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:", # imports / code here is executed during mypy tests.
]
fail_under = 75
precision = 2

[tool.coverage.xml]
output = "build/coverage.xml"